name: Telnyx offline readiness
on:
  push:
    branches: [codex/telnyx-coexistence-13-readiness, codex/telnyx-g0-smoke-staging, codex/b1-livia-waha-live, codex/b2-livia-waha-live, codex/b3-livia-cloudflare-egress, codex/b5-livia-private-live-test]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the resolved public toolchain (network allowed here)
        run: |
          python -m venv work/venv
          work/venv/bin/python -m pip install --upgrade pip==26.3
          work/venv/bin/python -m pip install --no-deps -r requirements/ci.lock
          work/venv/bin/python -m pip install --no-deps --no-build-isolation -e .
          work/venv/bin/python -m pip freeze --all > work/resolved.txt
      - name: Audit resolved dependencies (public advisory service)
        run: |
          work/venv/bin/pip-audit --cache-dir work/advisory-cache --format json --output work/pip-audit.json
      - name: Verify pinned Gitleaks and scan the public tree
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o work/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  work/gitleaks.tar.gz" | sha256sum --check
          tar -xzf work/gitleaks.tar.gz -C work gitleaks
          mkdir work/secret-source
          git archive HEAD | tar -xf - -C work/secret-source
          (
            cd work/secret-source
            scan_result=0
            ../gitleaks dir --redact --report-format json --report-path ../gitleaks.json . || scan_result=$?
            test "$scan_result" -le 1
            ../../work/venv/bin/python ../../scripts/check_gitleaks_report.py ../gitleaks.json
          )
          work/gitleaks git --redact --log-opts=f1496be42732b7e57d317444d7ed0020997f0327..HEAD .
      - name: Run all checks with no kernel network interfaces
        run: |
          sudo unshare --net -- sudo --user="$(id -un)" -- bash scripts/ci_offline.sh "$PWD/work/venv/bin/python"
      - name: Upload synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: telnyx-offline-evidence
          path: |
            work/ci-tests/pytest.xml
            work/pip-inspect.json
            work/pip-audit.json
            work/gitleaks.json
            work/resolved.txt
          retention-days: 14
  cloudflare-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.10.0"
          cache: npm
          cache-dependency-path: infra/waha-authority/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install resolved test runtimes
        run: |
          python -m venv work/venv
          work/venv/bin/python -m pip install --no-deps -r requirements/ci.lock
          npm ci --prefix infra/waha-authority --no-fund --no-audit
          npm audit --prefix infra/waha-authority --audit-level=low
      - name: Real workerd storage and Python protocol fixtures (local loopback only)
        run: |
          npm test --prefix infra/waha-authority > work/cloudflare-worker-tests.txt
          work/venv/bin/python scripts/check_telnyx_offline.py --python work/venv/bin/python --output work/cloudflare-tests tests/test_waha_cloudflare_integration.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: cloudflare-local-fixture-evidence
          path: |
            work/cloudflare-worker-tests.txt
            work/cloudflare-tests/pytest.xml
          retention-days: 14
